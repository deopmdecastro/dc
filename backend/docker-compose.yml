# DC OS — Backend local (hub de voz + música)
#
# Serviços:
#   dc-os-core      Rust · axum · WebSocket bridge para o firmware
#   stt-whisper     Whisper.cpp REST (transcrição PT-BR offline)
#   mopidy          Player + Librespot (Spotify Connect)

services:
  dc-os-core:
    build:
      context: ./dc-os-core
    container_name: dc-os-core
    restart: unless-stopped
    ports:
      - "${DC_CORE_HOST_PORT:-8081}:8080"          # HTTP + WebSocket /ws
    environment:
      RUST_LOG: info
      STT_URL:      http://stt-whisper:9000/asr
      MOPIDY_URL:   http://mopidy:6680
      DC_CORE_HOST: 0.0.0.0
      DC_CORE_PORT: "8080"
      SPOTIFY_TOKEN:         ${SPOTIFY_TOKEN:-}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN:-}
      SPOTIFY_CLIENT_ID:     ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_DEVICE_ID:     ${SPOTIFY_DEVICE_ID:-}
      # URL que a Spotify chama depois do login (tem de estar registado tal
      # e qual na app do Spotify Developer Dashboard).
      SPOTIFY_REDIRECT_URI:  ${SPOTIFY_REDIRECT_URI:-http://localhost:8081/spotify/callback}
      # Onde o refresh token obtido via /spotify/login fica guardado, para
      # sobreviver a um restart do container (ver volume spotify-data abaixo).
      SPOTIFY_TOKEN_STORE:   /data/spotify_refresh_token
    volumes:
      - spotify-data:/data
    depends_on:
      - stt-whisper
      - mopidy
    networks: [dc]

  stt-whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: stt-whisper
    restart: unless-stopped
    environment:
      ASR_MODEL:  small
      ASR_ENGINE: openai_whisper
    ports:
      - "9000:9000"
    volumes:
      - whisper-cache:/root/.cache/whisper
    networks: [dc]

  mopidy:
    image: wernight/mopidy:latest
    container_name: mopidy
    restart: unless-stopped
    ports:
      - "6680:6680"          # HTTP JSON-RPC / Web
      - "6600:6600"          # MPD
    volumes:
      - ./config/mopidy.conf:/config/mopidy.conf:ro
      - mopidy-data:/var/lib/mopidy
    networks: [dc]

networks:
  dc:
    driver: bridge

volumes:
  whisper-cache: {}
  mopidy-data:   {}
  spotify-data:  {}

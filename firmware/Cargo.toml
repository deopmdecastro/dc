[package]
name        = "dc-os-firmware"
version     = "0.1.0"
edition     = "2021"
authors     = ["DC OS Team"]
description = "DC Assistant firmware — ESP32-S3 (ES3C28P) + Slint"
license     = "MIT"
include     = [
    ".cargo/config.toml",
    "build.rs",
    "Cargo.toml",
    "partitions.csv",
    "platformio.ini",
    "rust-toolchain.toml",
    "sdkconfig.defaults",
    "scripts/**",
    "src/**",
    "ui/**",
]

[[bin]]
name = "dc-os-firmware"
path = "src/main.rs"

[profile.release]
# NOTE sobre o crash "rustc-LLVM ERROR: Cannot select: XtensaISD::PCREL_WRAPPER
# TargetConstantPool<[2 x float] [float 0.55, float 1.0]>" dentro de
# InnerPasscodeSetup...init:
#
# Testado e descartado:
#   - lto = true/"thin"/false -> sem efeito, crash identico.
#   - opt-level = "s" ou 2    -> sem efeito, crash identico (mesmo
#     endereco de constante LCP1072_2 nos dois casos).
#   - reescrever os ternarios `cond ? 1.0 : 0.55` como Slint `states`
#     -> sem efeito, crash identico.
#
# Ou seja, NAO e uma otimizacao do rustc/LLVM a inventar este padrao —
# o array [2 x float] ja vem assim do codigo Rust gerado pelo proprio
# compilador do Slint (slint-build/i-slint-compiler) para propriedades
# com mais de um valor possivel (opacity condicional, states, etc.),
# independentemente de opt-level/LTO. O Cargo.lock tinha o slint preso
# em 1.17.1 (o manifesto so pede "1.8", ^1.8 permite ate <2.0) — o
# gerador de codigo do item_tree mudou entre 1.8 e 1.17 e a versao mais
# recente produz um padrao que o backend LLVM-Xtensa (ainda imaturo)
# nao consegue selecionar. Fixado no [dependencies] abaixo: slint e
# slint-build pinados em "=1.8.0" (a versao que o projeto sempre visou).
# Depois de mudar o manifesto, correr localmente (maquina com o
# toolchain esp, nao da para fazer aqui):
#   cargo update -p slint --precise 1.8.0 -p slint-build --precise 1.8.0
# para regenerar o Cargo.lock antes do proximo `cargo build --release --locked`.
opt-level     = "s"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

[profile.dev]
opt-level = "z"
debug     = true

[features]
default = ["native"]
native  = []

[dependencies]
# ---- ESP-IDF bindings ----
esp-idf-svc   = { version = "0.52",  features = ["binstart", "alloc"] }
esp-idf-hal   = { version = "0.46" }
esp-idf-sys   = { version = "0.37",  features = ["binstart"] }

# ---- Slint (no_std, embedded backend) ----
# Pinado em "=1.8.0" (nao "1.8" ^caret): o Cargo.lock tinha subido para
# 1.17.1, cujo codegen do item_tree crasha o backend LLVM-Xtensa em
# componentes com propriedades condicionais (ver nota em [profile.release]
# acima). Depois desta mudanca, correr localmente:
#   cargo update -p slint --precise 1.8.0 -p slint-build --precise 1.8.0
slint         = { version = "=1.8.0", default-features = false, features = [
    "compat-1-2",
    "unsafe-single-threaded",
    "renderer-software",
    "libm",
] }

# ---- Core runtime ----
log           = "0.4"
anyhow        = "1"
heapless      = "0.8"
embedded-hal  = "1.0"
embedded-svc  = "0.29.0"
embedded-graphics = "0.8"

# ---- Networking (async on esp) ----
embassy-sync  = "0.6"
embassy-time  = "0.3"
serde         = { version = "1", default-features = false, features = ["derive"] }
serde_json    = { version = "1", default-features = false, features = ["alloc"] }

[build-dependencies]
embuild        = "0.33"
slint-build    = "=1.8.0"

# ---- Configuração do esp-idf-sys/embuild ----
# Sem esta tabela, o esp-idf-sys ignora por completo o `sdkconfig.defaults`
# do projeto e gera o `sdkconfig` só com os valores por omissão do Kconfig
# do ESP-IDF (ex.: CONFIG_ESP_MAIN_TASK_STACK_SIZE=3584, insuficiente para
# correr o Slint + Wi-Fi dentro da task `main`, causando stack overflow).
[package.metadata.esp-idf-sys]
esp_idf_tools_install_dir   = "custom:C:/DC/.embuild/espressif"
esp_idf_sdkconfig          = "sdkconfig"
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

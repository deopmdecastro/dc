[package]
name        = "dc-os-firmware"
version     = "0.1.0"
edition     = "2021"
authors     = ["DC OS Team"]
description = "DC Assistant firmware — ESP32-S3 (ES3C28P) + Slint"
license     = "MIT"
include     = [
    ".cargo/config.toml",
    "build.rs",
    "Cargo.toml",
    "partitions.csv",
    "platformio.ini",
    "rust-toolchain.toml",
    "sdkconfig.defaults",
    "scripts/**",
    "src/**",
    "ui/**",
]

[[bin]]
name = "dc-os-firmware"
path = "src/main.rs"

[profile.release]
# NOTE: "opt-level = \"s\"/\"z\"" (otimizacao por tamanho) fazia o LLVM
# transformar `select`s de dois literais float (ex.: um ternario de opacidade
# `cond ? 1.0 : 0.55`) num "load sem branch" a partir de um constant pool
# `[2 x float]`, indexado pela condicao — uma otimizacao classica para
# reduzir codigo evitando desvios. O backend Xtensa nao consegue selecionar
# a instrucao de endereçamento (PCREL_WRAPPER) para esse acesso especifico
# dentro da closure `init` gerada pelo Slint para PasscodeSetup (ver
# `opacity: root.filled > 0 ? 1.0 : 0.55;` em ui/first_boot.slint):
#   rustc-LLVM ERROR: Cannot select: XtensaISD::PCREL_WRAPPER
#   TargetConstantPool<[2 x float] [float 0.55, float 1.0]>
# lto=thin/false NAO resolve isto — a causa raiz e o nivel de otimizacao,
# nao o LTO. "opt-level = 2" evita esse caminho especifico de codegen
# (a transformacao select->array e tipica de -Os/-Oz). Ainda cabe
# confortavelmente na flash de 16MB deste dispositivo.
opt-level     = 2
lto           = "thin"
codegen-units = 1
strip         = true
panic         = "abort"

[profile.dev]
opt-level = "z"
debug     = true

[features]
default = ["native"]
native  = []

[dependencies]
# ---- ESP-IDF bindings ----
esp-idf-svc   = { version = "0.52",  features = ["binstart", "alloc"] }
esp-idf-hal   = { version = "0.46" }
esp-idf-sys   = { version = "0.37",  features = ["binstart"] }

# ---- Slint (no_std, embedded backend) ----
slint         = { version = "1.8", default-features = false, features = [
    "compat-1-2",
    "unsafe-single-threaded",
    "renderer-software",
    "libm",
] }

# ---- Core runtime ----
log           = "0.4"
anyhow        = "1"
heapless      = "0.8"
embedded-hal  = "1.0"
embedded-graphics = "0.8"

# ---- Networking (async on esp) ----
embassy-sync  = "0.6"
embassy-time  = "0.3"
serde         = { version = "1", default-features = false, features = ["derive"] }
serde_json    = { version = "1", default-features = false, features = ["alloc"] }

[build-dependencies]
embuild        = "0.33"
slint-build    = "1.8"

# ---- Configuração do esp-idf-sys/embuild ----
# Sem esta tabela, o esp-idf-sys ignora por completo o `sdkconfig.defaults`
# do projeto e gera o `sdkconfig` só com os valores por omissão do Kconfig
# do ESP-IDF (ex.: CONFIG_ESP_MAIN_TASK_STACK_SIZE=3584, insuficiente para
# correr o Slint + Wi-Fi dentro da task `main`, causando stack overflow).
[package.metadata.esp-idf-sys]
esp_idf_tools_install_dir   = "custom:C:/DC/.embuild/espressif"
esp_idf_sdkconfig          = "sdkconfig"
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

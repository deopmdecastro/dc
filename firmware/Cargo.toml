[package]
name        = "dc-os-firmware"
version     = "0.1.0"
edition     = "2021"
authors     = ["DC OS Team"]
description = "DC Assistant firmware — ESP32-S3 (ES3C28P) + Slint"
license     = "MIT"

[[bin]]
name = "dc-os-firmware"
path = "src/main.rs"

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

[profile.dev]
opt-level = "z"
debug     = true

[features]
default = ["native"]
native  = []

[dependencies]
# ---- ESP-IDF bindings ----
esp-idf-svc   = { version = "0.49",  features = ["binstart", "alloc"] }
esp-idf-hal   = { version = "0.44" }
esp-idf-sys   = { version = "0.35",  features = ["binstart"] }

# ---- Slint (no_std, embedded backend) ----
slint         = { version = "1.8", default-features = false, features = [
    "compat-1-2",
    "unsafe-single-threaded",
    "renderer-software",
    "libm",
] }

# ---- Core runtime ----
log           = "0.4"
anyhow        = "1"
heapless      = "0.8"
embedded-hal  = "1.0"
embedded-graphics = "0.8"

# ---- Networking (async on esp) ----
embassy-sync  = "0.6"
embassy-time  = "0.3"
serde         = { version = "1", default-features = false, features = ["derive"] }
serde_json    = { version = "1", default-features = false, features = ["alloc"] }

[build-dependencies]
embuild        = "0.32"
slint-build    = "1.8"

; DC OS firmware — ES3C28P (ESP32-S3, 8 MB PSRAM, 16 MB Flash)
; Rust + esp-idf via PlatformIO

[env:dc_assistant]
platform         = https://github.com/platformio/platform-espressif32.git
framework        = espidf
board            = esp32-s3-devkitc-1

; ---- Board tuning for ES3C28P (16 MB flash, 8 MB OPI PSRAM) ----
board_build.mcu           = esp32s3
board_build.f_cpu         = 240000000L
board_build.flash_mode    = qio
board_build.flash_size    = 16MB
board_build.psram_type    = opi
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_build.partitions    = partitions.csv

; ---- Rust integration ----
; Build orchestration is delegated to cargo (see Cargo.toml / build.rs).
extra_scripts       = pre:scripts/rust_build.py
build_flags         =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_MODE_OCT
    -DDC_OS_DISPLAY_W=320
    -DDC_OS_DISPLAY_H=240

; ---- Serial ----
monitor_speed       = 115200
monitor_filters     = esp32_exception_decoder
upload_speed        = 921600

; ---- SDK config overrides ----
board_build.embed_txtfiles =
    ui/main.slint
